<script type="text/javascript" data-ps-part="words">
  // What the plugin says in the editor, in Japanese and English: one table, one language picked by
  // Node-RED's editor language (RED.i18n.lang(); `ja…` is Japanese, anything else English).
  // `psEditorLang()` is also what the pane is told, so both speak the same language.
  var PS_EDITOR_WORDS = {
    tabLabel: { ja: 'PS', en: 'PS' },
    tabName: { ja: 'Physical Sandbox', en: 'Physical Sandbox' },
    openWindow: { ja: '別ウィンドウで開く', en: 'Open in a window' },
    proposed: { ja: 'エージェントの提案を読み込みました。確かめてから Deploy してください', en: 'The agent\'s proposal was imported. Check it, then Deploy' },
  };
  function psEditorLang() {
    var language = '';
    try { language = String(RED.i18n.lang() || ''); } catch (e) { language = ''; }
    return /^ja/i.test(language) ? 'ja' : 'en';
  }
  function psEditorSay(key) {
    return PS_EDITOR_WORDS[key][psEditorLang()];
  }
</script>
<script type="text/javascript">
  // Editor side of the Physical Sandbox plugin: the sidebar tab holds the pane (an iframe on
  // physical-sandbox/pane) and forwards what the editor hears on ps-pane/# and ps-editor/# to it. The pane says
  // "ready" when it listens; the editor's token and language, then the retained scene, snapshot and status held here go to it, so a
  // pane loaded after the editor subscribed starts where the others are.
  (function () {
    var FROM_EDITOR = 'ps-pane-message';
    var PANE_READY = 'ps-pane-ready';
    var EDITOR_TOKEN = 'ps-pane-token';
    var RETAINED = { 'ps-pane/scene': true, 'ps-pane/snapshot': true, 'ps-pane/status': true };
    // The pane's address, relative to the editor as the editor's own API calls are. The page needs
    // no token to load; the iframe is handed the editor's token by postMessage (below), and a
    // window of its own reads it where the editor keeps it. Never in the address.
    var PANE_URL = 'physical-sandbox/pane';

    function editorToken() {
      var tokens = RED.settings.get('auth-tokens');
      return (tokens && tokens.access_token) || null;
    }

    RED.plugins.registerPlugin('physical-sandbox', {
      type: 'physical-sandbox',
      onadd: function () {
        var held = {};
        var content = $('<div class="ps-pane-tab" style="display:flex;flex-direction:column;height:100%"></div>');
        var bar = $('<div style="flex:none;padding:6px 8px;border-bottom:1px solid var(--red-ui-secondary-border-color, #ddd)"></div>').appendTo(content);
        $('<button type="button" class="red-ui-button red-ui-button-small ps-open-window"></button>')
          .text(psEditorSay('openWindow'))
          .appendTo(bar)
          .on('click', function () { window.open(PANE_URL, 'physical-sandbox-pane'); });
        var iframe = $('<iframe class="ps-pane-frame" title="Physical Sandbox" style="flex:1;min-height:0;width:100%;border:0"></iframe>')
          .appendTo(content);

        RED.sidebar.addTab({
          id: 'physical-sandbox',
          label: psEditorSay('tabLabel'),
          name: psEditorSay('tabName'),
          iconClass: 'fa fa-cube',
          content: content,
          enableOnEdit: true,
        });

        function post(topic, data) {
          var target = iframe[0].contentWindow;
          if (target) target.postMessage({ type: FROM_EDITOR, topic: topic, data: data }, window.location.origin);
        }
        window.addEventListener('message', function (event) {
          if (event.origin !== window.location.origin || event.source !== iframe[0].contentWindow) return;
          if (event.data && event.data.type === PANE_READY) {
            var target = iframe[0].contentWindow;
            if (target) target.postMessage({ type: EDITOR_TOKEN, token: editorToken(), lang: psEditorLang() }, window.location.origin);
            for (var topic in held) if (Object.prototype.hasOwnProperty.call(held, topic)) post(topic, held[topic]);
          }
        });
        RED.comms.subscribe('ps-pane/#', function (topic, data) {
          if (RETAINED[topic]) held[topic] = data;
          post(topic, data);
        });
        // The editor link's requests reach the pane too: it answers ping and frames (none is held).
        // While another sidebar tab is selected the iframe has no size, and the pane refuses frames
        RED.comms.subscribe('ps-editor/#', function (topic, data) { post(topic, data); });
        iframe.attr('src', PANE_URL);
      },
    });
  })();
</script>
<script type="text/javascript" data-ps-part="editor-link">
  // The editor's side of the editor link (src/plugin/editor-link.ts): the plugin asks on
  // ps-editor/request and every open editor hears it. An editor answers flows, propose and ping
  // (a pane answers frames), by a POST to physical-sandbox/editor/answer: a relative address, so
  // the editor's own ajax setup adds the admin root and its token, as for its own calls. The body
  // goes as text with X-PS-Pane: 1, which the route reads itself (up to 20 MB): a node set over
  // Node-RED's 5 MB JSON limit gets through.
  // A proposal is claimed first and imported only when the claim is granted, so it lands in one
  // editor; a request whose id was cancelled (another editor answered, or the time ran out) is let go.
  (function () {
    var ANSWER_URL = 'physical-sandbox/editor/answer';
    // Told to the agent (which passes it on), so it stays in Japanese as the plugin's tools word it
    var NOT_IMPORTED = 'エディタで提案を取り込めませんでした';
    var CANCEL_KEPT_MS = 60000;
    var page = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    var cancelled = {};

    function post(body) {
      return $.ajax({ url: ANSWER_URL, type: 'POST', contentType: 'text/plain', headers: { 'X-PS-Pane': '1' }, data: JSON.stringify(body), dataType: 'json' });
    }
    function answer(id, ok, value, ticket) {
      var body = { id: id, ok: ok };
      if (ok) body.result = value; else body.error = value;
      if (ticket) body.ticket = ticket;
      post(body).then(null, function () {});
    }
    function messageOf(e) {
      return String((e && e.message) || e || '');
    }
    // The types of the proposal this editor does not have (as Node-RED's own import counts them:
    // tabs, subflows, groups, junctions and subflow instances are not node types)
    function notInstalled(nodes) {
      var missing = [];
      for (var i = 0; i < nodes.length; i++) {
        var type = nodes[i] && nodes[i].type;
        if (typeof type !== 'string' || missing.indexOf(type) !== -1) continue;
        if (/^(workspace|tab|subflow|group|junction)$/.test(type) || type.indexOf('subflow:') === 0) continue;
        if (!RED.nodes.getType(type)) missing.push(type);
      }
      return missing;
    }
    function importProposal(args) {
      var nodes = args && Array.isArray(args.nodes) ? args.nodes : [];
      var missing = notInstalled(nodes);
      // the ids before the import (Node-RED gives a tab or subflow of the proposal its new id in place)
      var ids = [];
      for (var n = 0; n < nodes.length; n++) ids.push(nodes[n] && nodes[n].id);
      var result = RED.view.importNodes(nodes, { addFlow: Boolean(args && args.newTab), generateIds: true, touchImport: true, notify: true });
      if (!result || !result.nodeMap) throw new Error(NOT_IMPORTED);
      // The tab the proposal went into: its own tab is added but not shown by Node-RED (only a tab
      // the import makes itself is), so it is shown here, and named in the answer
      var tab = null;
      for (var i = 0; i < ids.length && !tab; i++) {
        var made = result.nodeMap[ids[i]];
        if (made && made.z) tab = made.z;
      }
      if (tab) RED.workspaces.show(tab); else tab = RED.workspaces.active();
      // A touch import leaves the nodes in place with no drag to end it, and only the end of a drag
      // marks the workspace changed: marked here, so Deploy turns active
      RED.nodes.dirty(true);
      RED.notify(psEditorSay('proposed'), 'compact');
      // nodeMap holds each new node under its old id and under its new one: count the new nodes
      var imported = {};
      for (var key in result.nodeMap) {
        if (Object.prototype.hasOwnProperty.call(result.nodeMap, key) && result.nodeMap[key]) imported[result.nodeMap[key].id] = true;
      }
      return { imported: Object.keys(imported).length, tab: tab, notInstalled: missing };
    }

    RED.comms.subscribe('ps-editor/cancel', function (topic, data) {
      if (!data || typeof data.id !== 'string') return;
      var now = Date.now();
      cancelled[data.id] = now;
      for (var id in cancelled) if (Object.prototype.hasOwnProperty.call(cancelled, id) && now - cancelled[id] > CANCEL_KEPT_MS) delete cancelled[id];
    });

    RED.comms.subscribe('ps-editor/request', function (topic, request) {
      if (!request || typeof request.id !== 'string') return;
      var id = request.id;
      if (request.op === 'ping') { answer(id, true, { kind: 'editor', page: page }); return; }
      if (Object.prototype.hasOwnProperty.call(cancelled, id)) return;
      if (request.op === 'flows') {
        var flows;
        try { flows = RED.nodes.createCompleteNodeSet({ credentials: false }); } catch (e) { answer(id, false, messageOf(e)); return; }
        answer(id, true, flows);
      } else if (request.op === 'propose') {
        post({ id: id, claim: true }).then(function (claim) {
          // Granted: the cancel the plugin sends now is for the other editors
          if (!claim || claim.granted !== true) return;
          var result;
          try {
            result = importProposal(request.args);
          } catch (e) {
            var why = messageOf(e);
            answer(id, false, why === NOT_IMPORTED ? why : NOT_IMPORTED + ': ' + why, claim.ticket);
            return;
          }
          answer(id, true, result, claim.ticket);
        }, function () {});
      }
    });
  })();
</script>
