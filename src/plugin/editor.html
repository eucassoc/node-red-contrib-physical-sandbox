<script type="text/javascript">
  // Editor side of the Physical Sandbox plugin: the sidebar tab holds the pane (an iframe on
  // physical-sandbox/pane) and forwards what the editor hears on ps-pane/# to it. The pane says
  // "ready" when it listens; the retained scene, snapshot and status held here then go to it, so a
  // pane loaded after the editor subscribed starts where the others are.
  (function () {
    var FROM_EDITOR = 'ps-pane-message';
    var PANE_READY = 'ps-pane-ready';
    var RETAINED = { 'ps-pane/scene': true, 'ps-pane/snapshot': true, 'ps-pane/status': true };

    // The pane's address (relative to the editor, as the editor's own API calls are). With
    // adminAuth on, the editor's token goes along so the page itself can be fetched.
    function paneUrl() {
      var tokens = RED.settings.get('auth-tokens');
      var token = tokens && tokens.access_token;
      return 'physical-sandbox/pane' + (token ? '?access_token=' + encodeURIComponent(token) : '');
    }

    RED.plugins.registerPlugin('physical-sandbox', {
      type: 'physical-sandbox',
      onadd: function () {
        var held = {};
        var content = $('<div class="ps-pane-tab" style="display:flex;flex-direction:column;height:100%"></div>');
        var bar = $('<div style="flex:none;padding:6px 8px;border-bottom:1px solid var(--red-ui-secondary-border-color, #ddd)"></div>').appendTo(content);
        $('<button type="button" class="red-ui-button red-ui-button-small ps-open-window"></button>')
          .text('別ウィンドウで開く ')
          .append($('<small style="opacity:.7"></small>').text('Open in a window'))
          .appendTo(bar)
          .on('click', function () { window.open(paneUrl(), 'physical-sandbox-pane'); });
        var iframe = $('<iframe class="ps-pane-frame" title="Physical Sandbox" style="flex:1;min-height:0;width:100%;border:0"></iframe>')
          .appendTo(content);

        RED.sidebar.addTab({
          id: 'physical-sandbox',
          label: 'PS',
          name: 'Physical Sandbox',
          iconClass: 'fa fa-cube',
          content: content,
          enableOnEdit: true,
        });

        function post(topic, data) {
          var target = iframe[0].contentWindow;
          if (target) target.postMessage({ type: FROM_EDITOR, topic: topic, data: data }, window.location.origin);
        }
        window.addEventListener('message', function (event) {
          if (event.origin !== window.location.origin || event.source !== iframe[0].contentWindow) return;
          if (event.data && event.data.type === PANE_READY) {
            for (var topic in held) if (Object.prototype.hasOwnProperty.call(held, topic)) post(topic, held[topic]);
          }
        });
        RED.comms.subscribe('ps-pane/#', function (topic, data) {
          if (RETAINED[topic]) held[topic] = data;
          post(topic, data);
        });
        iframe.attr('src', paneUrl());
      },
    });
  })();
</script>
