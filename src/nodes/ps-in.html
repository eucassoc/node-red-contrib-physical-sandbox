<script type="text/javascript">
  (function () {
    // A topic name as PS.com's devices/state.js isTopicName has it (empty: every site)
    function isSite(v) {
      if (v === '' || v === undefined) return true;
      var s = String(v).trim();
      var length = Array.from(s).length;
      return length >= 1 && length <= 80 && !/[\/+#\u0000-\u001f\u007f]/.test(s) && s.charAt(0) !== '$'
        && s !== '__proto__' && s !== 'constructor' && s !== 'prototype';
    }
    RED.nodes.registerType('ps in', {
      category: 'physical sandbox',
      color: '#c7e9c0',
      defaults: {
        name: { value: '' },
        site: { value: '', validate: isSite },
      },
      inputs: 1,
      outputs: 1,
      icon: 'font-awesome/fa-cube',
      paletteLabel: function () { return this._('ps-in.palette'); },
      label: function () { return this.name || (this.site ? this._('ps-in.palette') + ' ' + this.site : this._('ps-in.palette')); },
    });
  })();
</script>

<script type="text/html" data-template-name="ps in">
  <div class="form-row">
    <label for="node-input-site"><i class="fa fa-map-marker"></i> <span data-i18n="ps-in.label.site"></span></label>
    <input type="text" id="node-input-site" data-i18n="[placeholder]ps-in.placeholder.site">
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="ps-in.label.name"></span></label>
    <input type="text" id="node-input-name" data-i18n="[placeholder]ps-in.placeholder.name">
  </div>
</script>
