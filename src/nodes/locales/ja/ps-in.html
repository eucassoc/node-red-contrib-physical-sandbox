<script type="text/html" data-help-name="ps in">
  <p><code>mqtt in</code> などから受け取った <code>ps/&lt;site&gt;/&lt;id&gt;/&lt;kind&gt;</code> のメッセージを、Physical Sandbox の画面に流します。</p>
  <h3>入力</h3>
  <dl class="message-properties">
    <dt>topic <span class="property-type">string</span></dt>
    <dd><code>ps/&lt;site&gt;/&lt;id&gt;/state</code>・<code>command</code>・<code>event</code></dd>
    <dt>payload <span class="property-type">object | string | buffer</span></dt>
    <dd>JSON のオブジェクト。<code>at</code>（ミリ秒）が必要です。<code>mqtt in</code> の出力の設定が「自動判定」「文字列」「バイナリバッファ」のどれでも受け取れます。</dd>
    <dt class="optional">retain <span class="property-type">boolean</span></dt>
    <dd>ブローカーが保持していたメッセージは画面のロボットを動かしますが、開いている記録の動きとしては残しません。</dd>
  </dl>
  <h3>出力</h3>
  <p>受け取ったメッセージをそのまま送ります。</p>
  <h3>詳細</h3>
  <p>読み込めないメッセージは捨て、最初の 1 回だけ状態を黄色で表示します。<b>現地</b>を指定すると、その現地のメッセージだけを受け取ります。現地の名前が正しくないときは何も受け取らず、状態を赤で表示します。プラグインが読み込まれていないときも、メッセージは出力に送ります。</p>
</script>
