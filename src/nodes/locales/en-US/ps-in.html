<script type="text/html" data-help-name="ps in">
  <p>Takes <code>ps/&lt;site&gt;/&lt;id&gt;/&lt;kind&gt;</code> messages, for example from <code>mqtt in</code>, into the Physical Sandbox pane.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>topic <span class="property-type">string</span></dt>
    <dd><code>ps/&lt;site&gt;/&lt;id&gt;/state</code>, <code>command</code> or <code>event</code></dd>
    <dt>payload <span class="property-type">object | string | buffer</span></dt>
    <dd>A JSON object with <code>at</code> (milliseconds). Any Output setting of <code>mqtt in</code> works: a parsed object, a string or a Buffer.</dd>
    <dt class="optional">retain <span class="property-type">boolean</span></dt>
    <dd>A message the broker kept moves the robots in the pane but is not kept as part of the opened record.</dd>
  </dl>
  <h3>Outputs</h3>
  <p>The message as it came.</p>
  <h3>Details</h3>
  <p>A message that cannot be read is dropped; the first one turns the status yellow. With a <b>Site</b>, only that site's messages are taken; a site that is not a site name takes nothing and turns the status red. Without the plugin, messages still go on to the output.</p>
</script>
